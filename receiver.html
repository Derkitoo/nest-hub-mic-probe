<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nest Hub microphone probe</title><script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>body{margin:0;padding:32px;color:#eef4ff;background:#101827;font:24px sans-serif}h1{color:#77c7ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px}.ok{color:#6ee7a8}.error{color:#ff8d8d}</style></head><body><h1>Test du microphone</h1><p id="status">Initialisation…</p><pre id="details"></pre><script>const s=document.querySelector('#status'),d=document.querySelector('#details');function show(m,x,o=false){s.textContent=m;s.className=o?'ok':'error';d.textContent=x||''}async function probe(){if(!navigator.mediaDevices){show('API mediaDevices absente','Le moteur Web Cast ne publie aucune API de capture.');return}let devices=[];try{devices=await navigator.mediaDevices.enumerateDevices()}catch(e){devices=[{kind:'enumerateDevices-error',label:e.message}]}if(typeof navigator.mediaDevices.getUserMedia!=='function'){show('getUserMedia absent',JSON.stringify(devices,null,2));return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});const tracks=stream.getAudioTracks().map(t=>({label:t.label,enabled:t.enabled,muted:t.muted,readyState:t.readyState,settings:t.getSettings?t.getSettings():{}}));show('MICRO ACCESSIBLE',JSON.stringify({devices,tracks},null,2),true)}catch(e){show('MICRO REFUSÉ',JSON.stringify({name:e.name,message:e.message,devices},null,2))}}const context=cast.framework.CastReceiverContext.getInstance();context.addEventListener(cast.framework.system.EventType.READY,probe);context.start({disableIdleTimeout:true});</script></body></html>
