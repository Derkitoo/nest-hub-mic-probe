<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nest Hub microphone probe v2</title><script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><style>body{margin:0;padding:28px;color:#eef4ff;background:#101827;font:22px sans-serif}h1{color:#31b9ff;margin:0 0 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.ok{color:#6ee7a8}.error{color:#ff9aaa}</style></head><body><h1>Test microphone v2</h1><p id="status">Initialisation…</p><pre id="details"></pre><script>const s=document.querySelector('#status'),d=document.querySelector('#details');let ran=false;const report={};function done(m,ok=false){s.textContent=m;s.className=ok?'ok':'error';d.textContent=JSON.stringify(report,null,2)}async function probe(){if(ran)return;ran=true;report.secureContext=isSecureContext;report.mediaDevices=!!navigator.mediaDevices;report.permissionsPolicy=document.permissionsPolicy?.allowsFeature?.('microphone')??document.featurePolicy?.allowsFeature?.('microphone')??'inconnu';try{report.permission=(await navigator.permissions.query({name:'microphone'})).state}catch(e){report.permissionQuery=e.name+': '+e.message}if(!navigator.mediaDevices){done('API mediaDevices absente');return}report.supportedConstraints=navigator.mediaDevices.getSupportedConstraints?.()||{};try{report.devices=await navigator.mediaDevices.enumerateDevices()}catch(e){report.enumerateDevices=e.name+': '+e.message}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});report.tracks=stream.getAudioTracks().map(t=>({label:t.label,readyState:t.readyState,settings:t.getSettings?.()||{}}));done('MICRO ACCESSIBLE',true)}catch(e){report.getUserMedia={name:e.name,message:e.message,constraints:'audio:true'};done('MICRO REFUSÉ')}}setTimeout(probe,1200);try{const c=cast.framework.CastReceiverContext.getInstance();c.addEventListener(cast.framework.system.EventType.READY,probe);c.start({disableIdleTimeout:true})}catch(e){setTimeout(probe,100)}</script></body></html>
